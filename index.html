@import url('https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

.wc-root *{box-sizing:border-box;margin:0;padding:0;}
.wc-root{
  --bg:#05080f; --gold:#ffcf45; --green:#2ad879; --text:#eef3f1; --muted:#8696a4;
  --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.045);
  position:relative; min-height:100vh; width:100%; overflow:hidden;
  font-family:'Sora',sans-serif; color:var(--text);
  background:
    radial-gradient(1100px 520px at 18% -8%, rgba(42,216,121,.16), transparent 60%),
    radial-gradient(900px 520px at 92% 8%, rgba(60,120,255,.12), transparent 55%),
    radial-gradient(800px 600px at 50% 120%, rgba(255,207,69,.07), transparent 60%),
    var(--bg);
}
.wc-root .mono{font-family:'Space Mono',monospace;}
.loading{padding:80px 20px;text-align:center;color:var(--muted);font-size:15px;}

.pitch-line{position:absolute;top:0;left:50%;width:1px;height:340px;background:linear-gradient(rgba(255,255,255,.10),transparent);transform:translateX(-50%);pointer-events:none;}
.pitch-circle{position:absolute;top:118px;left:50%;width:230px;height:230px;border:1px solid rgba(255,255,255,.06);border-radius:50%;transform:translateX(-50%);pointer-events:none;}

.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:30px 16px 60px;}

.hd{text-align:center;margin-bottom:22px;}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:8px;}
.title{font-family:'Anton',sans-serif;font-size:clamp(46px,15vw,82px);line-height:.92;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff 30%, #9fb0bd);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{max-width:430px;margin:12px auto 0;font-size:13.5px;line-height:1.55;color:var(--muted);}

.champ-banner{display:flex;gap:12px;align-items:center;margin-bottom:18px;padding:14px 16px;border-radius:16px;
  background:linear-gradient(100deg,rgba(255,207,69,.16),rgba(255,207,69,.04));border:1px solid rgba(255,207,69,.4);}
.champ-trophy{font-size:30px;}
.champ-line{font-size:14px;} .champ-line b{color:var(--gold);}
.champ-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}

.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;}
.sync-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:13px;cursor:pointer;
  font-family:'Sora',sans-serif;font-size:14px;font-weight:600;color:#04140b;border:none;
  background:linear-gradient(180deg,#3ef193,#1fc873);box-shadow:0 8px 26px rgba(42,216,121,.28);transition:transform .12s,filter .12s;}
.sync-btn:hover{filter:brightness(1.06);} .sync-btn:active{transform:translateY(1px);}
.sync-btn.busy{filter:saturate(.6);cursor:wait;}
.sync-ico{font-size:17px;display:inline-block;} .sync-ico.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.share-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 18px;border-radius:13px;cursor:pointer;
  font-family:'Sora',sans-serif;font-size:14px;font-weight:600;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.15s;}
.share-btn:hover{background:rgba(255,255,255,.09);}
.ctrl-meta{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.sync-msg{text-align:center;font-size:12.5px;margin:6px 0 0;padding:8px 12px;border-radius:10px;}
.sync-msg.ok{color:#7ff0b4;background:rgba(42,216,121,.10);}
.sync-msg.err{color:#ff97a6;background:rgba(255,94,116,.10);}

.toggles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 8px;}
.tog{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;cursor:pointer;
  font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.15s;}
.tog:hover{color:var(--text);}
.tog-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);transition:.15s;}
.tog.on{color:var(--text);border-color:rgba(42,216,121,.5);background:rgba(42,216,121,.10);}
.tog.on .tog-dot{background:var(--green);box-shadow:0 0 10px var(--green);}
.tog.ghost{border-style:dashed;}

.rules{margin:8px 0 14px;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);}
.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;}
.rules-grid > div{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:6px;}
.rk{color:var(--muted);} .rv{font-family:'Space Mono',monospace;color:var(--green);font-weight:700;}
.rv.gold{color:var(--gold);}
.rules-note{margin-top:12px;font-size:12px;line-height:1.6;color:var(--muted);}
.rules-note b{color:var(--text);}

.board{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.card{border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden;
  opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes rise{to{opacity:1;transform:none;}}
.card.r1{border-color:rgba(255,207,69,.45);background:linear-gradient(160deg,rgba(255,207,69,.10),rgba(255,255,255,.03));}
.card.r2,.card.r3{border-color:rgba(255,255,255,.16);}

.card-head{width:100%;display:flex;align-items:center;gap:13px;padding:14px 14px;background:none;border:none;cursor:pointer;text-align:left;}
.rank{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-family:'Anton',sans-serif;font-size:20px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);}
.rank.rk1{background:linear-gradient(180deg,#ffd45e,#e7a716);color:#3a2700;border:none;box-shadow:0 4px 16px rgba(255,207,69,.4);}
.rank.rk2{background:linear-gradient(180deg,#dfe6ec,#9aa6b2);color:#1b2733;border:none;}
.rank.rk3{background:linear-gradient(180deg,#e0a978,#b06f3c);color:#2a1605;border:none;}
.team-info{flex:1 1 auto;min-width:0;}
.team-name{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flag-strip{display:flex;gap:5px;margin-top:3px;}
.mini-flag{font-size:13px;line-height:1;opacity:.9;}
.pts-wrap{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
.pts{font-size:23px;font-weight:700;line-height:1;color:var(--text);}
.card.r1 .pts{color:var(--gold);}
.pts-lbl{font-size:9px;letter-spacing:.18em;color:var(--muted);margin-top:2px;}
.chev{flex:0 0 auto;font-size:20px;color:var(--muted);transition:transform .2s;margin-left:2px;}
.chev.up{transform:rotate(180deg);}

.clines{padding:0 14px 12px;display:flex;flex-direction:column;gap:5px;}
.cline{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.c-flag{font-size:14px;width:18px;text-align:center;}
.c-name{flex:1 1 auto;color:#c4cdd6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-tier{font-size:9px;color:var(--muted);margin-left:6px;letter-spacing:.05em;}
.c-stage{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;border:1px solid;letter-spacing:.02em;}
.c-pts{font-size:12.5px;color:var(--text);width:34px;text-align:right;}

.editors{padding:4px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:460px){.editors{grid-template-columns:1fr;}}
.ed{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:11px;}
.ed-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ed-flag{font-size:15px;} .ed-name{flex:1;font-size:13px;font-weight:600;}
.ed-pts{font-size:11.5px;color:var(--green);}
.ed-row{display:flex;gap:8px;margin-bottom:9px;}
.stepper{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:7px 8px;}
.st-lbl{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.st-ctrl{display:flex;align-items:center;justify-content:space-between;}
.st-ctrl button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--text);font-size:16px;cursor:pointer;line-height:1;display:grid;place-items:center;}
.st-ctrl button:active{background:var(--green);color:#04140b;}
.st-val{font-size:16px;font-weight:700;}
.ed-stage{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:7px 8px;}
.ed-stage select{width:100%;margin-top:5px;background:#0c1320;color:var(--text);border:1px solid var(--line);
  border-radius:7px;padding:7px 8px;font-family:'Sora',sans-serif;font-size:12.5px;cursor:pointer;}
.ed-math{margin-top:9px;font-size:11px;color:var(--muted);text-align:center;}
.ed-math b{color:var(--text);}
.team-total{grid-column:1 / -1;text-align:right;font-size:13px;color:var(--muted);padding-top:4px;border-top:1px solid var(--line);}
.team-total b{color:var(--green);font-size:16px;}

.foot{margin-top:26px;text-align:center;}
.reset-btn{background:none;border:1px solid rgba(255,94,116,.3);color:#ff8d9c;padding:9px 16px;border-radius:10px;font-family:'Sora',sans-serif;font-size:12px;cursor:pointer;transition:.15s;}
.reset-btn:hover{background:rgba(255,94,116,.08);}
.reset-confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);}
.rc-yes{background:#ff5e74;border:none;color:#fff;padding:8px 14px;border-radius:9px;font-size:12px;cursor:pointer;font-weight:600;}
.rc-no{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:9px;font-size:12px;cursor:pointer;}
.disclaimer{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.5;max-width:420px;margin-left:auto;margin-right:auto;}

/* SHARE OVERLAY */
.share-overlay{position:fixed;inset:0;z-index:50;background:rgba(2,4,9,.74);backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;}
.share-modal{width:100%;max-width:560px;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(180deg,#0a1120,#070b14);box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;}
.share-modal::before{content:"";display:block;height:5px;background:linear-gradient(90deg,#2ad879,#ffcf45);}
.share-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 12px;}
.share-kick{font-size:11px;letter-spacing:.22em;color:var(--green);font-weight:700;}
.share-stamp{font-size:11.5px;color:var(--muted);margin-top:4px;}
.share-x{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:13px;}
.share-list{padding:4px 14px 6px;display:flex;flex-direction:column;}
.share-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.05);}
.share-rank{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'Anton',sans-serif;font-size:16px;background:rgba(255,255,255,.06);color:var(--text);}
.share-rank.rk1{background:linear-gradient(180deg,#ffd45e,#e7a716);color:#3a2700;}
.share-rank.rk2{background:linear-gradient(180deg,#dfe6ec,#9aa6b2);color:#1b2733;}
.share-rank.rk3{background:linear-gradient(180deg,#e0a978,#b06f3c);color:#2a1605;}
.share-mid{flex:1 1 auto;min-width:0;}
.share-team{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.share-sub{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;}
.share-cc{font-size:10.5px;color:var(--muted);}
.share-total{flex:0 0 auto;font-size:20px;font-weight:700;color:var(--green);}
.sr1 .share-total{color:var(--gold);}
.share-foot{padding:10px 20px;font-size:10.5px;color:#6b7886;border-top:1px solid rgba(255,255,255,.06);}
.share-actions{display:flex;gap:10px;padding:14px 20px 6px;}
.sa-primary{flex:1;padding:12px;border-radius:11px;border:none;cursor:pointer;font-family:'Sora',sans-serif;font-weight:600;font-size:13.5px;color:#04140b;background:linear-gradient(180deg,#3ef193,#1fc873);}
.sa-secondary{flex:1;padding:12px;border-radius:11px;cursor:pointer;font-family:'Sora',sans-serif;font-weight:600;font-size:13.5px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);}
.share-note{text-align:center;font-size:12px;color:#7ff0b4;padding:8px 20px 0;}
.share-tip{text-align:center;font-size:11px;color:var(--muted);padding:8px 20px 18px;}
.import-area{width:100%;min-height:96px;resize:vertical;background:#0c1320;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-family:'Space Mono',monospace;font-size:12px;line-height:1.55;}
.import-area:focus{outline:none;border-color:rgba(42,216,121,.5);}
.import-row{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;}
.import-apply{padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-family:'Sora',sans-serif;font-weight:600;font-size:13px;color:#04140b;background:linear-gradient(180deg,#3ef193,#1fc873);}
.import-apply:active{transform:translateY(1px);}
.import-msg{font-size:12px;color:#7ff0b4;}
`;
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
})();

</script>
</body>
</html>
